services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - reloop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGSSLMODE: disable
      APP_BASE_URL: https://${RELOOP_DOMAIN}
      RELOOP_ALLOWED_ORIGINS: https://${RELOOP_DOMAIN}
      REQUIRE_EMAIL_VERIFICATION: "true"
    volumes:
      - reloop_uploads:/app/server/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose: ["3001"]
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RELOOP_DOMAIN: ${RELOOP_DOMAIN:?Set RELOOP_DOMAIN to your public domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [private]

volumes:
  reloop_pgdata:
  reloop_uploads:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
