AWSTemplateFormatVersion: '2010-09-09'
Description: Private, encrypted S3 storage for ReLoop handover and verification evidence.
Resources:
  ReLoopEvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
  ReLoopEvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReLoopEvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ReLoopEvidenceBucket.Arn
              - !Sub '${ReLoopEvidenceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
Outputs:
  EvidenceBucketName:
    Description: Set this as RELOOP_S3_BUCKET in the ReLoop server environment.
    Value: !Ref ReLoopEvidenceBucket
  EvidenceBucketArn:
    Value: !GetAtt ReLoopEvidenceBucket.Arn
